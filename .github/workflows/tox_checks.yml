# NB: this name is used in the status badge
name: tox checks

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 6"  # 5:00 UTC every Saturday

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    steps:
      - name: Git clone
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run check
        run: |
          uv run check-manifest .
          uv run isort --verbose --check-only --diff src tests

  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - name: Git clone
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run docs
        run: |
          uv run sphinx-build -E -b html docs docs/_build
          uv run sphinx-build -b linkcheck docs docs/_build
