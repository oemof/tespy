name: tox pytests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 6"  # 5:00 UTC every Saturday

jobs:
  pytest:
    permissions:
      contents: read
      checks: write

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: uv sync --extra test
    - name: Run pytest
      run: uv run pytest --cov --cov-report=term-missing -vv

    - name: Check test coverage
      run: |
        uv run coverage report -m --fail-under=85
        uv run coverage lcov -o coverage.lcov

    - name: Coveralls Parallel
      uses: coverallsapp/github-action@v2
      with:
        file: coverage.lcov
        format: lcov
        flag-name: test-${{ join(matrix.*, '-') }}
        parallel: true

  finish:
    permissions:
      contents: read
      checks: write
    needs: pytest
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
        carryforward: "test-3.11,test-3.12,test-3.13"
